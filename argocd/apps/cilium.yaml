# Cilium is bootstrapped by ansible (ansible/roles/k8s-basic-service) since the
# cluster needs a CNI before ArgoCD itself can schedule pods. This Application
# is only meant to take over day-2 management once the cluster is up.
#
# TODO: mirror/adjust values from ansible/roles/k8s-basic-service/templates/cilium-values.yaml.j2
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: <CHART_VERSION>
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
