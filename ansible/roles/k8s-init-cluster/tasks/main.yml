---
# Init k8s cluster on the first controlplane node
- name: Determine the bootstrap control-plane node
  set_fact:
    k8s_bootstrap_host: "{{ groups['k8s_control_plane'][0] }}"

- name: Check whether this node already joined the cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_kubelet_conf

- name: Run kubeadm init on the bootstrap control-plane node
  command: >-
    kubeadm init
    --service-cidr={{ k8s_service_cidr }}
    --control-plane-endpoint={{ k8s_control_plane_endpoint }}
    --upload-certs
    --apiserver-advertise-address={{ apiserver_address }}
    --kubernetes-version={{ kubernetes_release }}
    --skip-phases=addon/kube-proxy
  args:
    creates: /etc/kubernetes/kubelet.conf   # idempotent check built-in
  register: kubeadm_init_result
  async: 600   # kubeadm init can take a while on slow registries/network
  poll: 10
  when: inventory_hostname == k8s_bootstrap_host

- name: Set up kubeconfig on the bootstrap node
  block:
    - name: Ensure kubeconfig directory exists
      file:
        path: "{{ kubeconfig_path | dirname }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy admin.conf to kubeconfig path
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        remote_src: true
  when:
    - inventory_hostname == k8s_bootstrap_host

# Control-plane join artifacts, short-lived, in-memory only

- name: Generate kubeadm join command (base command + bootstrap token)
  command: kubeadm token create --print-join-command
  register: kubeadm_join_cmd
  changed_when: false
  when: inventory_hostname == k8s_bootstrap_host

- name: Generate a fresh certificate key for control-plane join
  command: kubeadm init phase upload-certs --upload-certs
  register: kubeadm_upload_certs
  changed_when: false
  when: inventory_hostname == k8s_bootstrap_host

- name: Extract certificate key from upload-certs output
  set_fact:
    k8s_certificate_key: "{{ kubeadm_upload_certs.stdout_lines[-1] }}"
  when: inventory_hostname == k8s_bootstrap_host


# --- Remaining control-plane nodes: kubeadm join --control-plane --------

- name: Join additional control-plane nodes to the cluster
  command: >-
    {{ hostvars[k8s_bootstrap_host].kubeadm_join_cmd.stdout }} --control-plane
    --certificate-key {{ hostvars[k8s_bootstrap_host].k8s_certificate_key }}
    --apiserver-advertise-address={{ apiserver_address }}
  register: kubeadm_join_result
  when:
    - inventory_hostname != k8s_bootstrap_host
    - not k8s_kubelet_conf.stat.exists

- name: Set up kubeconfig on joined control-plane nodes
  block:
    - name: Ensure kubeconfig directory exists
      file:
        path: "{{ kubeconfig_path | dirname }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy admin.conf to kubeconfig path
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        remote_src: true
  when:
    - inventory_hostname != k8s_bootstrap_host
    - kubeadm_join_result is changed
