---
# Disable systemd-resolve
- name: Disable systemd-resolved
  systemd:
    name: systemd-resolved
    enabled: no
    state: stopped

- name: Remove /etc/resolv.conf symlink
  file:
    path: /etc/resolv.conf
    state: absent

- name: Create static resolv.conf
  copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 127.0.0.53
      options edns0 trust-ad
    mode: '0644'

- name: Configure PowerDNS Authoritative 5.0 + Recursor 5.4 repos
  hosts: dns_servers
  become: true

  vars:
    pdns_key_url: "https://repo.powerdns.com/FD380FBB-pub.asc"

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Ensure keyrings dir exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # Same key file, fetched once — reused by both repos
    - name: Download PowerDNS signing key
      ansible.builtin.get_url:
        url: "{{ pdns_key_url }}"
        dest: /etc/apt/keyrings/pdns-pub.asc
        mode: "0644"

    # SEPARATE files — this is the fix for the overwrite bug
    - name: Add Authoritative 5.0 repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pdns-auth.list
        content: |
          deb [signed-by=/etc/apt/keyrings/pdns-pub.asc] http://repo.powerdns.com/ubuntu noble-auth-50 main
        mode: "0644"

    - name: Add Recursor 5.4 repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pdns-rec.list
        content: |
          deb [signed-by=/etc/apt/keyrings/pdns-pub.asc] http://repo.powerdns.com/ubuntu noble-rec-54 main
        mode: "0644"

    - name: Pin PowerDNS Authoritative packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/pdns-auth
        content: |
          Package: pdns-server pdns-backend-*
          Pin: origin repo.powerdns.com
          Pin-Priority: 600
        mode: "0644"

    - name: Pin PowerDNS Recursor packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/pdns-rec
        content: |
          Package: pdns-recursor
          Pin: origin repo.powerdns.com
          Pin-Priority: 600
        mode: "0644"

    - name: apt update
      ansible.builtin.apt:
        update_cache: true