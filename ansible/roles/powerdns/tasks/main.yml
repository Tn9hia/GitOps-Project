---
# Disable systemd-resolved
- name: Disable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped

- name: Remove /etc/resolv.conf symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Create static resolv.conf
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 127.0.0.1
      nameserver 8.8.8.8
      options edns0 trust-ad
    mode: '0644'

# Install PostgreSQL as the backend database for PowerDNS
- name: Install PostgreSQL
  ansible.builtin.include_tasks: postgresql.yml

# Install PowerDNS and prerequisites packages
- name: Install PowerDNS Authoritative Server
  ansible.builtin.import_tasks: pdns-authoritative.yml

# Install dnsdist
- name: Install dnsdist
  ansible.builtin.include_tasks: pdns-dnsdist.yml
  when: enable_dist | bool

- name: Install and config PostgreSQL
  ansible.builtin.include_tasks: postgresql.yml

- name: Configure PowerDNS Authoritative Server
  ansible.builtin.include_tasks: pdns_config.yml

- name: Enable and start PowerDNS services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - pdns
    - dnsdist
