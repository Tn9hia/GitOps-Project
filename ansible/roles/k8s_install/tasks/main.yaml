---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes GPG key
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key
      | gpg --dearmor -o {{ kubernetes_keyring }}
    creates: "{{ kubernetes_keyring }}"

- name: Set correct permissions on Kubernetes keyring
  ansible.builtin.file:
    path: "{{ kubernetes_keyring }}"
    mode: "0644"

- name: Add Kubernetes apt repository
  ansible.builtin.copy:
    dest: "{{ kubernetes_repo_file }}"
    content: |
      deb [signed-by={{ kubernetes_keyring }}] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /
    owner: root
    group: root
    mode: "0644"

- name: Update apt cache after adding Kubernetes repo
  ansible.builtin.apt:
    update_cache: true

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Hold Kubernetes packages at current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true
