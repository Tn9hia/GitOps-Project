# Ansible tasks for installing required packages on all Kubernetes nodes
- name: Get current hostname
  ansible.builtin.command: hostname
  register: current_hostname
  changed_when: false
  tags: init-setup

- name: Update 127.0.1.1 entry in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ inventory_hostname }} {{ current_hostname.stdout }}"
    insertafter: '^127\.0\.1\.1'
    state: present
  tags: init-setup

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: init-setup

- name: Update apt cache
  apt:
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"
  tags: init-setup
  
- name: Upgrade all packages to the latest version
  apt:
    upgrade: dist
  when: ansible_facts['os_family'] == "Debian"
  tags: init-setup

# Install common packages
- name: Install common packages
  apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - software-properties-common
      - gnupg
      - lsb-release
      - gpg
    state: present
  tags: init-setup

# System configurations
# Disable swap, load necessary kernel modules, set sysctl params
- name: Disable swap immediately
  command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0

- name: Mask swap.target to prevent any swap backend from re-enabling
  ansible.builtin.systemd:
    name: swap.target
    masked: yes
    state: stopped

- name: Remove zram-config if present (common on cloud images)
  ansible.builtin.apt:
    name: zram-config
    state: absent
  ignore_errors: true

# Load kernel modules for K8s
- name: Load kernel modules for K8s
  modprobe:
    name: "{{ item }}"
    state: present
  loop: 
    - br_netfilter
    - overlay
  tags: init-setup

- name: Persist kernel modules on boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter
      overlay
    mode: "0644"
  tags: init-setup

- name: Set and persist sysctl params for K8s
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: yes
  loop:
    # - { name: "net.ipv6.conf.all.disable_ipv6", value: 1 }
    # - { name: "net.ipv6.conf.default.disable_ipv6", value: 1 }
    - { name: "net.bridge.bridge-nf-call-iptables", value: 1 }
    - { name: "net.ipv4.ip_forward", value: 1 }
  tags: init-setup

# Install containerd plugins
- name: Download containerd archive
  get_url:
    url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ cpu_arch }}.tar.gz"
    dest: "/tmp/containerd-{{ containerd_version }}.tar.gz"
    mode: "0644"
  tags: containerd

- name: Extract and install containerd
  unarchive:
    src: "/tmp/containerd-{{ containerd_version }}.tar.gz"
    dest: /usr/local
    remote_src: yes
    creates: /usr/local/bin/containerd
  tags: containerd

- name: Download systemd service file for containerd
  get_url:
    url: "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
    dest: /usr/lib/systemd/system/containerd.service
    mode: "0644"
  tags: containerd

- name: Ensure /etc/containerd directory exists
  file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: containerd
  
- name: Deploy containerd config (with CNI/registry/pause image defaults, SystemdCgroup enabled)
  template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd
  tags: containerd

- name: Start and enable containerd service
  systemd:
    name: containerd
    enabled: yes
    state: started
    daemon_reload: yes
  tags: containerd

# Install runc
- name: Download runc archive
  get_url:
    url: "https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.{{ cpu_arch }}"
    dest: /usr/local/sbin/runc
    mode: "0755"
  tags: runc

- name: Verify runc installation
  command: runc --version
  register: runc_version
  changed_when: false
  tags: runc

# Install CNI plugins
- name: Download CNI plugins archive
  get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-{{ cpu_arch }}-v{{ cni_version }}.tgz"
    dest: /tmp/cni-plugins.tgz
    mode: "0644"
  tags: cni
  
- name: Ensure /opt/cni/bin directory exists
  file:
    path: /opt/cni/bin
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: cni
  
- name: Extract and install CNI plugins
  unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: yes
    creates: /opt/cni/bin/bridge
  tags: cni

- name: Ensure containerd systemd drop-in directory exists
  file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [containerd, proxy]

# Configure containerd proxy (only if enabled)
- name: Configure containerd proxy (only if enabled)
  template:
    src: http-proxy.conf.j2
    dest: /etc/systemd/system/containerd.service.d/http-proxy.conf
    owner: root
    group: root
    mode: "0644"
  when: containerd_proxy_enabled | default(false)
  notify:
    - Reload systemd daemon
    - Restart containerd
  tags: [containerd, proxy]

- name: Remove containerd proxy drop-in (if disabled)
  file:
    path: /etc/systemd/system/containerd.service.d/http-proxy.conf
    state: absent
  when: not (containerd_proxy_enabled | default(false))
  notify:
    - Reload systemd daemon
    - Restart containerd
  tags: [containerd, proxy]

# Install Kubernetes components: kubeadm, kubelet, kubectl
- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key"
    dest: /tmp/k8s-release.key
    mode: "0644"

- name: Dearmor GPG key
  ansible.builtin.shell: |
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  
- name: Add Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/"
    suites: "/"
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Set permission for GPG file
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: "0644"
    owner: root
    group: root

- name: Update apt cache after adding Kubernetes repo
  ansible.builtin.apt:
    update_cache: yes
  
- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    allow_downgrade: yes
    update_cache: yes
  
- name: Hold Kubernetes packages at current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  
- name: Enable and start kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: yes
    state: stopped
