# roles/common/tasks/dns.yml
---
- name: Ensure systemd-resolved is installed
  apt:
    name: systemd-resolved
    state: present

- name: Configure DNS resolvers via systemd-resolved
  template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: '0644'
  register: dns_config
  notify: restart systemd-resolved

- name: Reboot Server to apply configuration
  reboot:
    msg: "Rebooting to apply DNS configuration"
    connect_timeout: 20
    reboot_timeout: 300
    pre_reboot_delay: 5
    post_reboot_delay: 30
  when: 
    - dns_config.changed

- name: Ensure systemd-resolved enabled and running
  systemd:
    name: systemd-resolved
    enabled: yes
    state: started

- name: Ensure /etc/resolv.conf points to systemd-resolved stub
  file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: yes