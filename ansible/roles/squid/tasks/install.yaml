---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install squid and apache2-utils
  ansible.builtin.apt:
    name: "{{ squid_package_list }}"
    state: present

- name: Install python3-passlib (required by htpasswd module)
  ansible.builtin.apt:
    name: python3-passlib
    state: present

- name: Enable squid service
  ansible.builtin.service:
    name: "{{ squid_service }}"
    enabled: true
