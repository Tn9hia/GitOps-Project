---
- name: Ensure squid cache directory exists
  ansible.builtin.file:
    path: "{{ squid_cache_dir }}"
    state: directory
    owner: proxy
    group: proxy
    mode: "0750"

- name: Deploy squid config
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ squid_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "squid -k parse -f %s"
  notify:
    - Stop squid
    - Init squid cache
    - Start squid

- name: Ensure squid is started and enabled
  ansible.builtin.service:
    name: "{{ squid_service }}"
    state: started
    enabled: true
