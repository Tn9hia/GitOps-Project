---
- name: Install nginx
  apt:
    name: nginx
    state: present
  notify:
    - restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - restart nginx

- name: Deploy nginx configuration for apt-repo
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/apt-repo
  notify:
    - restart nginx

- name: Create SSL certificate directory
  file:
    path: "{{ aptly_ssl_certificate | dirname }}"
    state: directory
    mode: '0755'

- name: Copy SSL certificate
  copy:
    src: "{{ aptly_ssl_certificate_src }}"
    dest: "{{ aptly_ssl_certificate }}"
    mode: '0644'

- name: Copy SSL private key
  copy:
    src: "{{ aptly_ssl_certificate_key_src }}"
    dest: "{{ aptly_ssl_certificate_key }}"
    mode: '0600'

- name: Enable nginx site for apt-repo
  file:
    path: /etc/nginx/sites-enabled/apt-repo
    src: /etc/nginx/sites-available/apt-repo
    state: link
  notify:
    - restart nginx
