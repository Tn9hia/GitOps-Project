#     system: true
#     state: present

- name: Create aptly root directory
  file:
    path: "{{ aptly_root_dir }}"
    state: directory
    owner: "{{ aptly_user }}"
    group: "{{ aptly_user }}"
    mode: "0755"
  tags:
    - bootstrap

