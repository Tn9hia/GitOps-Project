# Configure aptly
- name: Create aptly config directory
  file:
    path: "/etc/aptly"
    state: directory
    mode: "0755"
    owner: "{{ aptly_user }}"
    group: "{{ aptly_user }}"
  tags:
    - bootstrap

- name: Configure aptly
  template:
    src: aptly.conf.j2
    dest: /etc/aptly/aptly.conf
  tags:
    - bootstrap

