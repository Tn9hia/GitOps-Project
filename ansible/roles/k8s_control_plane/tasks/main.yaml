---
- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_initialized

- name: Initialize Kubernetes control plane
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --control-plane-endpoint={{ k8s_control_plane_endpoint }}
    --upload-certs
  when: not k8s_initialized.stat.exists

- name: Ensure .kube directory exists for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy admin.conf to root kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    owner: root
    group: root
    mode: "0600"
    remote_src: true

- name: Get join command from control plane
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Save join token to file
  ansible.builtin.copy:
    content: "{{ join_command.stdout | regex_search('token (\\S+)', '\\1') | first }}"
    dest: "{{ join_token_file }}"
    mode: "0644"

- name: Save CA cert hash to file
  ansible.builtin.copy:
    content: "{{ join_command.stdout | regex_search('discovery-token-ca-cert-hash (\\S+)', '\\1') | first }}"
    dest: "{{ ca_cert_hash_file }}"
    mode: "0644"

- name: Fetch join token to Ansible controller
  ansible.builtin.fetch:
    src: "{{ join_token_file }}"
    dest: "{{ playbook_dir }}/fetched/join-token"
    flat: true

- name: Fetch CA cert hash to Ansible controller
  ansible.builtin.fetch:
    src: "{{ ca_cert_hash_file }}"
    dest: "{{ playbook_dir }}/fetched/ca-cert-hash"
    flat: true

- name: Distribute join token to worker nodes
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/fetched/join-token"
    dest: "{{ join_token_file }}"
    mode: "0644"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_worker'] }}"

- name: Distribute CA cert hash to worker nodes
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/fetched/ca-cert-hash"
    dest: "{{ ca_cert_hash_file }}"
    mode: "0644"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_worker'] }}"
