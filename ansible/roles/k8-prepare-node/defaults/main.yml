---
# Variables shared across k8s roles/plays (containerd/runc/cni versions,
# pod_network_cidr, kubeconfig_path, join_token_file, ...) now live in
# group_vars/k8s.yml, since k8s-init-cluster and other roles need them too
# and role defaults don't carry over across separate plays.

# Proxy for containerd (shared with role: common)
common_proxy_enabled: false
common_proxy_url: "http://proxy.internal.local:3128"
common_no_proxy: "localhost,127.0.0.1,10.0.0.0/8,.internal.nghia.local"
